<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор рекламных показателей v5.2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;padding:20px;color:#e0e0e0}
  .container{max-width:1200px;margin:0 auto}
  h1{text-align:center;color:#ffd700;margin-bottom:8px;font-size:28px}
  .subtitle{text-align:center;color:#888;margin-bottom:24px;font-size:14px}
  .card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:20px;margin-bottom:16px}
  .card h2{color:#4fc3f7;font-size:18px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px}
  .form-group{margin-bottom:12px}
  label{display:block;margin-bottom:4px;font-size:13px;color:#aaa}
  input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.3);color:#fff;font-size:15px}
  input:focus,select:focus{outline:none;border-color:#4fc3f7}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:200px}
  .row-3>*{flex:1;min-width:150px}
  button{width:100%;padding:14px;border:none;border-radius:8px;background:linear-gradient(90deg,#ff6b35,#f7931e);color:#fff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px}
  button:hover{opacity:0.9}
  .result-card{background:rgba(79,195,247,0.1);border:1px solid rgba(79,195,247,0.3)}
  .result-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
  .result-row:last-child{border-bottom:none}
  .result-label{color:#aaa;font-size:14px}
  .result-value{color:#4fc3f7;font-weight:bold;font-size:16px;text-align:right}
  .result-value.gold{color:#ffd700;font-size:20px}
  .note{font-size:12px;color:#666;margin-top:12px;line-height:1.5}
  .region-badge{display:inline-block;background:rgba(255,107,53,0.2);color:#ff6b35;padding:2px 8px;border-radius:12px;font-size:11px}
  .season-hint{font-size:12px;color:#888;margin-top:4px;line-height:1.4}
  .season-hint b{color:#ffd700}
  .age-bar{display:flex;height:20px;border-radius:4px;overflow:hidden;margin-top:6px;width:100%}
  .age-seg{display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .season-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;width:100%}
  .season-cell{text-align:center;padding:4px;border-radius:4px;font-size:10px;background:rgba(255,255,255,0.05)}
  .district-table{width:100%;border-collapse:collapse;margin-top:8px}
  .district-table th,.district-table td{padding:6px 8px;text-align:left;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.08)}
  .district-table th{color:#4fc3f7}
  .district-table td{color:#ccc}
  .autofill-note{font-size:11px;color:#4caf50;margin-top:2px}
  .auto-plate{background:rgba(255,193,7,0.15);border-left:4px solid #ffc107;padding:12px 14px;border-radius:6px;margin-bottom:10px;color:#ffc107;font-size:13px;line-height:1.6}
  .auto-plate b{color:#ffd54f}
  .warn-note{background:rgba(255,107,53,0.15);border-left:4px solid #ff6b35;padding:12px 14px;border-radius:6px;margin-bottom:14px;color:#ffb399;font-size:13px;line-height:1.5}
  .error-box{color:#ff6b6b;font-weight:bold;padding:12px;background:rgba(255,107,107,0.1);border-radius:8px}
  @media(max-width:600px){.row,.row-3{flex-direction:column}.season-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="container">
  <h1>📊 Калькулятор рекламных показателей v5.2</h1>
  <p class="subtitle">35 отраслей · 95 городов · автонаселение · авто-бюджет · типы районов</p>

  <div class="card">
    <h2>1. Объект рекламирования</h2>
    <div class="form-group">
      <label>Что рекламируем?</label>
      <input type="text" id="object" value="кулинарные курсы">
    </div>
    <div class="row">
      <div class="form-group">
        <label>Город (можно оставить пустым)</label>
        <input type="text" id="city" value="Казань" list="cityList" autocomplete="off">
        <datalist id="cityList"></datalist>
        <div class="autofill-note" id="cityNote"></div>
      </div>
      <div class="form-group">
        <label>Население города (можно оставить пустым)</label>
        <input type="number" id="population" value="1341141">
      </div>
    </div>
    <div class="form-group">
      <label>Регион (коэффициент CPC). Если не знаете — выберите «Другой регион»</label>
      <select id="region">
        <option value="moscow">Москва и МО (×1,63)</option>
        <option value="spb">СПб и ЛО (×1,48)</option>
        <option value="krasnodar">Краснодар (×1,35)</option>
        <option value="tatarstan" selected>Татарстан (×1,15)</option>
        <option value="novosibirsk">Новосибирск (×1,10)</option>
        <option value="rostov">Ростов (×1,10)</option>
        <option value="sverdlovsk">Свердловск (×1,06)</option>
        <option value="samara">Самара (×1,00)</option>
        <option value="krasnoyarsk">Красноярск (×1,00)</option>
        <option value="bashkortostan">Башкортостан (×0,95)</option>
        <option value="voronezh">Воронеж (×0,95)</option>
        <option value="nizhny">Нижний Новгород (×0,95)</option>
        <option value="perm">Пермь (×0,95)</option>
        <option value="volgograd">Волгоград (×0,90)</option>
        <option value="chelyabinsk">Челябинск (×0,85)</option>
        <option value="omsk">Омск (×0,80)</option>
        <option value="other">Другой регион (×1,00)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Тип района (обязателен даже без города)</label>
      <select id="district">
        <option value="spalny_big" selected>Спальный район большого города</option>
        <option value="spalny_small">Спальный район маленького города</option>
        <option value="center_big">Центральный район большого города</option>
        <option value="center_small">Центральный район маленького города</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2>2. Бюджет и сроки</h2>
    <div class="warn-note">💡 Если бюджет или срок не указаны — оставьте пустым или введите 0. Калькулятор рассчитает сам.</div>
    <div class="row-3">
      <div class="form-group">
        <label>Digital (руб./мес.)</label>
        <input type="number" id="budgetDigital" value="105000">
      </div>
      <div class="form-group">
        <label>Офлайн/email (руб./мес.)</label>
        <input type="number" id="budgetOffline" value="45000">
      </div>
      <div class="form-group">
        <label>Срок (мес.)</label>
        <input type="number" id="months" value="2" min="0" max="12">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>3. Ниша и канал</h2>
    <div class="row">
      <div class="form-group">
        <label>Тип продукта</label>
        <select id="niche">
          <option value="education" selected>Онлайн-образование / курсы</option>
          <option value="services">Услуги для населения</option>
          <option value="ecommerce">Интернет-магазин</option>
          <option value="b2b">B2B / бизнес-услуги</option>
          <option value="realestate">Недвижимость</option>
          <option value="medical">Медицина</option>
          <option value="fitness">Фитнес / спорт</option>
          <option value="food">Общепит / доставка</option>
          <option value="travel">Туризм</option>
          <option value="beauty">Красота / салоны</option>
          <option value="auto">Авто / автосервис</option>
          <option value="finance">Финансы / страхование</option>
          <option value="legal">Юридические услуги</option>
          <option value="construction">Строительство / ремонт</option>
          <option value="pets">Зоотовары</option>
          <option value="cleaning">Клининг</option>
          <option value="dental">Стоматология</option>
          <option value="psychology">Психология / коучинг</option>
          <option value="it">IT / разработка</option>
          <option value="logistics">Логистика</option>
          <option value="languages">Иностранные языки</option>
          <option value="driving">Автошкола</option>
          <option value="music">Музыка / вокал</option>
          <option value="art">Художественная школа</option>
          <option value="dance">Танцы</option>
          <option value="yoga">Йога</option>
          <option value="tutoring">Репетиторство / ЕГЭ</option>
          <option value="kids">Детское развитие</option>
          <option value="kindergarten">Частный детсад</option>
          <option value="wedding">Свадьбы / праздники</option>
          <option value="photo">Фото / видео</option>
          <option value="flowers">Цветы</option>
          <option value="handmade">Хендмейд</option>
          <option value="books">Книги</option>
          <option value="hotels">Отели</option>
        </select>
        <div class="season-hint" id="seasonHint"></div>
      </div>
      <div class="form-group">
        <label>Канал</label>
        <select id="channel">
          <option value="search" selected>Яндекс.Директ (поиск)</option>
          <option value="rsya">Яндекс.Директ (РСЯ)</option>
          <option value="target">VK таргет</option>
        </select>
      </div>
    </div>
    <div class="row-3">
      <div class="form-group">
        <label>Возраст</label>
        <select id="ageGroup">
          <option value="all" selected>Все (18–60)</option>
          <option value="18-24">18–24</option>
          <option value="25-34">25–34</option>
          <option value="35-44">35–44</option>
          <option value="45-54">45–54</option>
          <option value="55-60">55–60</option>
        </select>
      </div>
      <div class="form-group">
        <label>Месяц запуска</label>
        <select id="month">
          <option value="1">Январь</option><option value="2">Февраль</option>
          <option value="3">Март</option><option value="4">Апрель</option>
          <option value="5">Май</option><option value="6">Июнь</option>
          <option value="7">Июль</option><option value="8">Август</option>
          <option value="9" selected>Сентябрь</option>
          <option value="10">Октябрь</option><option value="11">Ноябрь</option>
          <option value="12">Декабрь</option>
        </select>
      </div>
      <div class="form-group">
        <label>Конкуренция</label>
        <select id="competition">
          <option value="very_low">Очень низкая</option>
          <option value="low">Низкая</option>
          <option value="medium" selected>Средняя</option>
          <option value="high">Высокая</option>
          <option value="very_high">Очень высокая</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>Качество объявлений</label>
        <select id="adQuality">
          <option value="very_low">Очень низкое</option>
          <option value="low">Низкое</option>
          <option value="medium" selected>Среднее</option>
          <option value="good">Хорошее</option>
          <option value="excellent">Отличное</option>
        </select>
      </div>
      <div class="form-group">
        <label>Доверие к рекламе</label>
        <select id="trust">
          <option value="very_low">Очень низкое</option>
          <option value="low">Низкое</option>
          <option value="medium" selected>Среднее</option>
          <option value="high">Высокое</option>
          <option value="very_high">Очень высокое</option>
        </select>
      </div>
    </div>
  </div>

  <button id="calcBtn" type="button" onclick="calculate(); return false;">Рассчитать прогноз</button>

  <div id="results" class="card result-card" style="display:none;margin-top:20px">
    <h2>📈 Прогноз рекламной кампании</h2>
    <div id="autoPlates"></div>
    <div id="resultsContent"></div>
    <p class="note" id="disclaimer"></p>
  </div>
</div>

function el(id){return document.getElementById(id);}
function normalizeCity(s){
  return String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
}

// ============================================================
// АВТОЗАПОЛНЕНИЕ ГОРОДА И РЕГИОНА
// ============================================================
function setupCityAutofill(){
  var cityInput = el('city');
  var popInput = el('population');
  var note = el('cityNote');
  var dl = el('cityList');
  if(!cityInput||!popInput||!note||!dl) return;

  if(dl.children.length===0){
    var keys = Object.keys(CITY_POPULATION).sort();
    for(var i=0;i<keys.length;i++){
      var opt = document.createElement('option');
      opt.value = keys[i].charAt(0).toUpperCase()+keys[i].slice(1);
      dl.appendChild(opt);
    }
  }

  function fill(){
    var key = normalizeCity(cityInput.value);
    if(cityInput.value.trim()===''){
      note.textContent = 'Город не указан — расчёт по средним значениям для района';
      note.style.color = '#ff9800';
      return;
    }
    if(CITY_POPULATION[key]){
      popInput.value = CITY_POPULATION[key];
      note.textContent = '✓ Население подставлено ('+CITY_POPULATION[key].toLocaleString('ru-RU')+' чел., 2025–2026)';
      note.style.color = '#4caf50';
      if(CITY_REGION[key]){
        var regSel = el('region');
        for(var j=0;j<regSel.options.length;j++){
          if(regSel.options[j].value === CITY_REGION[key]){
            regSel.selectedIndex = j;
            break;
          }
        }
      }
    } else {
      note.textContent = 'Город не в базе — введите население вручную или оставьте пустым';
      note.style.color = '#ff9800';
    }
  }
  cityInput.addEventListener('input',fill);
  cityInput.addEventListener('change',fill);
  cityInput.addEventListener('blur',fill);
  fill();
}

// ============================================================
function updateSeasonHint(){
  var nk = el('niche').value;
  var data = SEASONALITY[nk];
  if(!data) return;
  var mn = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  var mx = Math.max.apply(null,data);
  var mi = Math.min.apply(null,data);
  var pk=[],lw=[];
  data.forEach(function(v,i){ if(v===mx) pk.push(mn[i]); if(v===mi) lw.push(mn[i]); });
  el('seasonHint').innerHTML = '<b>Пик сезонности:</b> '+pk.join(', ')+' (×'+mx+') · <b>Спад:</b> '+lw.join(', ')+' (×'+mi+')';
}

// ============================================================
// РЕКОМЕНДАЦИИ
// ============================================================
function recommendBudget(pop,rc,cc,d){
  var base = Math.min(Math.max(pop*0.08,30000),300000);
  var rec = Math.round(base*rc*cc*d.cpc);
  return {digital:rec, offline:Math.round(rec*0.3)};
}
function recommendMonths(nk,startM){
  var data = SEASONALITY[nk];
  var mx = Math.max.apply(null,data);
  for(var i=0;i<6;i++){
    var idx = (startM-1+i)%12;
    if(data[idx]===mx) return Math.max(2,i+1);
  }
  return 3;
}

// ГЛАВНАЯ ФУНКЦИЯ
// ============================================================
function calculate(){
  try {
    var obj = el('object').value || 'объект';

    // --- Входные данные с проверкой «не указано» ---
    var cityRaw = el('city').value.trim();
    var cityEmpty = cityRaw === '';
    var city = cityEmpty ? 'Не указан' : cityRaw;

    var popRaw = parseInt(el('population').value);
    var popEmpty = !popRaw || popRaw <= 0;

    var rk = el('region').value;
    var regionEmpty = (rk === 'other');

    var bdRaw = parseFloat(el('budgetDigital').value)||0;
    var boRaw = parseFloat(el('budgetOffline').value)||0;
    var mnRaw = parseInt(el('months').value)||0;

    var nk = el('niche').value;
    var ch = el('channel').value;
    var ag = el('ageGroup').value;
    var m = parseInt(el('month').value)||9;
    var ck = el('competition').value;
    var aqk = el('adQuality').value;
    var tk = el('trust').value;
    var dk = el('district').value;

    var niche = BENCHMARKS[nk];
    var rc = REGION_COEFF[rk];
    var as = AGE_SHARES[nk];
    var sc = SEASONALITY[nk][m-1];
    var cc = COMPETITION_COEFF[ck];
    var aq = AD_QUALITY_COEFF[aqk];
    var tc = TRUST_COEFF[tk];
    var d = DISTRICT_COEFF[dk];

    // --- ПЛАШКИ ---
    var plates = [];
    var unknownGeo = [];
    if(cityEmpty) unknownGeo.push('город');
    if(regionEmpty) unknownGeo.push('регион');
    if(popEmpty) unknownGeo.push('население');

    var pop = popRaw;
    if (unknownGeo.length > 0) {
      if (popEmpty) {
        pop = d.defaultPop;
      }
      plates.push(
        '<b>⚠ Не указано: ' + unknownGeo.join(', ') + '.</b><br>' +
        'Расчёт выполнен по среднероссийским значениям для выбранного типа района: <b>' + d.label + '</b>.<br>' +
        'Принятые значения: население <b>' + pop.toLocaleString('ru-RU') + ' чел.</b>, региональный коэффициент <b>×' + rc + '</b>.<br>' +
        'Для точного расчёта укажите город, регион и население.'
      );
    }

    // --- Авто-бюджет и срок ---
    var bd = bdRaw, bo = boRaw, mm = mnRaw;
    if(bd===0 && bo===0){
      var rec = recommendBudget(pop,rc,cc,d);
      bd = rec.digital; bo = rec.offline;
      plates.push(
        '<b>⚠ Бюджет не указан — рассчитано рекомендуемое значение.</b><br>' +
        'Digital: <b>' + bd.toLocaleString('ru-RU') + ' ₽/мес</b> · ' +
        'Офлайн/email: <b>' + bo.toLocaleString('ru-RU') + ' ₽/мес</b><br>' +
        'Формула: население × 0,08 × регион × конкуренция × тип района (30–300 тыс. ₽). Офлайн = 30 % digital.'
      );
    }
    if(mm===0){
      mm = recommendMonths(nk,m);
      plates.push(
        '<b>⚠ Срок не указан — рассчитан рекомендуемый.</b><br>' +
        'Рекомендуемая длительность: <b>' + mm + ' мес.</b> (чтобы захватить пик сезонности «' + niche.name + '»).'
      );
    }
    if(mm<1) mm=1;

    // --- Расчёт ---
    var ta = Math.round(pop*0.60);
    var am=1.0, al='Все возрасты';
    if(ag!=='all'){
      var idx = ['18-24','25-34','35-44','45-54','55-60'].indexOf(ag);
      am = as[idx]||0.2; al=ag+' лет';
    }
    var aa = Math.round(ta*am);
    var inter = Math.round(aa*0.15*sc);

    var baseCPC = niche.cpc[ch];
    var cpc = Math.round(baseCPC*rc*cc*aq.cpc*sc*d.cpc);
    var tdb = bd*mm, tob = bo*mm, tb = tdb+tob;
    var clicks = cpc>0 ? Math.round(tdb/cpc) : 0;

    var baseC2L = niche.clickToLead[ch];
    var c2l = Math.min(1, baseC2L*aq.conv*tc*d.conv);
    var ld = Math.round(clicks*c2l);
    var cplO = niche.cpl[ch]*rc*cc;
    var lo = cplO>0 ? Math.round(tob/cplO) : 0;
    var tl = ld+lo;
    var reg = Math.round(tl*niche.leadToReg);
    var pay = Math.round(reg*niche.regToSale);
    var reach = Math.round(inter*0.30);
    var aw = ta>0 ? Math.min(30,Math.round(reach/ta*100*0.5)) : 0;
    var acpl = tl>0 ? Math.round(tb/tl) : 0;
    var rev = pay*niche.avgCheck;
    var romi = tb>0 ? Math.round((rev-tb)/tb*100) : 0;

    // Возрастная диаграмма
    var ac = ['#ff6b35','#4fc3f7','#ffd700','#9c27b0','#4caf50'];
    var abh = '<div class="age-bar">';
    as.forEach(function(s,i){ abh += '<div class="age-seg" style="width:'+(s*100)+'%;background:'+ac[i]+'">'+Math.round(s*100)+'%</div>'; });
    abh += '</div>';

    // Сезонная диаграмма
    var sd = SEASONALITY[nk];
    var mnNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    var sh = '<div class="season-grid">';
    sd.forEach(function(v,i){
      var bg = v>1.3?'rgba(255,107,53,0.5)':v<0.7?'rgba(79,195,247,0.3)':'rgba(255,255,255,0.05)';
      sh += '<div class="season-cell" style="background:'+bg+'">'+mnNames[i]+'<br><b>'+v+'</b></div>';
    });
    sh += '</div>';

    // Таблица по районам
    var dth = '<table class="district-table"><tr><th>Тип района</th><th>CPC, ₽</th><th>Конверсия</th><th>Заявок</th><th>CPL, ₽</th></tr>';
    var dks = ['spalny_big','spalny_small','center_big','center_small'];
    var bestCPL = Infinity, bestD = 'spalny_big';
    dks.forEach(function(k){
      var dd = DISTRICT_COEFF[k];
      var dCPC = Math.round(baseCPC*rc*cc*aq.cpc*sc*dd.cpc);
      var dC = dCPC>0?Math.round(tdb/dCPC):0;
      var dC2L = Math.min(1,baseC2L*aq.conv*tc*dd.conv);
      var dLD = Math.round(dC*dC2L);
      var dTL = dLD+lo;
      var dCPL = dTL>0?Math.round(tb/dTL):0;
      if(dCPL>0 && dCPL<bestCPL){ bestCPL=dCPL; bestD=k; }
      var isSel = k===dk?' style="background:rgba(79,195,247,0.1);font-weight:bold;"':'';
      dth += '<tr'+isSel+'><td>'+dd.label+(k===dk?' ★':'')+'</td><td>'+dCPC+'</td><td>'+(dC2L*100).toFixed(1)+'%</td><td>'+dTL+'</td><td>'+dCPL+'</td></tr>';
    });
    dth += '</table>';
    dth += '<div class="autofill-note" style="margin-top:4px;">★ — выбранный район · Лучший CPL: <b>'+DISTRICT_COEFF[bestD].label+'</b> ('+bestCPL+' ₽)</div>';

    var cityDisplay = city + ' <span class="region-badge">×'+rc+'</span>';
    if (cityEmpty) cityDisplay = '<i style="color:#ff9800">Не указан</i> <span class="region-badge">×'+rc+'</span>';

    var html =
      row('Объект',obj) +
      row('Город / регион',cityDisplay) +
      row('Тип района',d.label) +
      row('Ниша',niche.name) +
      row('Возрастная группа',al) +
      rowHTML('Возрастные доли ЦА',abh) +
      row('Сезонность (месяц '+m+')','×'+sc) +
      row('Конкуренция','×'+cc) +
      row('Качество объявлений','CPC ×'+aq.cpc+' · Конв. ×'+aq.conv) +
      row('Доверие','×'+tc) +
      row('Срок кампании',mm+' мес.') +
      row('Бюджет за весь срок',tb.toLocaleString('ru-RU')+' ₽') +
      row('Целевая аудитория (18–60)',ta.toLocaleString('ru-RU')+' чел.') +
      row('Аудитория выбранного возраста',aa.toLocaleString('ru-RU')+' чел.') +
      row('Интересуются',inter.toLocaleString('ru-RU')+' чел.') +
      row('Планируемый охват',reach.toLocaleString('ru-RU')+' чел.') +
      row('CPC (итоговый)',cpc+' ₽') +
      row('Клики',clicks.toLocaleString('ru-RU')) +
      row('Конверсия клик→заявка',(c2l*100).toFixed(2)+'%') +
      row('Заявки digital',ld.toLocaleString('ru-RU')) +
      row('Заявки офлайн/email',lo.toLocaleString('ru-RU')) +
      rowGold('Всего заявок',tl.toLocaleString('ru-RU')) +
      rowGold('Регистрации / конверсии',reg.toLocaleString('ru-RU')) +
      rowGold('Платные клиенты',pay.toLocaleString('ru-RU')) +
      row('Фактический CPL',acpl+' ₽') +
      row('Рост узнаваемости','~'+aw+'%') +
      row('Средний чек',niche.avgCheck.toLocaleString('ru-RU')+' ₽') +
      row('Прогноз выручки',rev.toLocaleString('ru-RU')+' ₽') +
      row('ROMI',romi+'%') +
      rowHTML('Сезонный профиль',sh) +
      rowHTML('Значения по типам районов',dth);

    var ph = '';
    if(plates.length>0) ph = '<div class="auto-plate">'+plates.join('<br><br>')+'</div>';

    el('autoPlates').innerHTML = ph;
    el('resultsContent').innerHTML = html;
    el('results').style.display = 'block';

    el('disclaimer').innerHTML =
      '<b>Источники:</b> click.ru (CPC по регионам, Q2 2025), Яндекс.Директ (сезонность), ' +
      'ze.media, E-Promo Group, Sostav.ru, GetCourse, Google Ads Quality Score, ' +
      'Росстат / World Population Review (население 2025–2026). ' +
      '<b>Формула:</b> CPC = базовая × регион × конкуренция × качество × сезонность × тип района. ' +
      'Конверсия = базовая × качество × доверие × тип района. Бюджет и выручка — за весь срок.';

    el('results').scrollIntoView({behavior:'smooth'});
  } catch(err){
    console.error(err);
    el('resultsContent').innerHTML = '<div class="error-box">Ошибка расчёта: '+err.message+'</div>';
    el('results').style.display = 'block';
  }
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
function initApp(){
  try {
    setupCityAutofill();
    updateSeasonHint();
    var n = el('niche');
    if(n) n.addEventListener('change', updateSeasonHint);
    var b = el('calcBtn');
    if(b) b.addEventListener('click', function(e){ e.preventDefault(); calculate(); });
  } catch(e){ console.error('init', e); }
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
</body>
</html>
